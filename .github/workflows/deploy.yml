name: Build and deploy Barnawa EWS

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button - forces a fresh build/deploy on demand

permissions:
  contents: write   # write needed for the monthly heartbeat commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub disables scheduled workflows on a repo after 60 days with no other
      # repo activity. A push/workflow_dispatch resets that clock, but a schedule-only
      # run does not, so on the first scheduled run of each UTC month this makes a
      # trivial commit to keep the schedule alive indefinitely.
      - name: Monthly heartbeat commit (keeps the 30-min schedule from being disabled)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            if ! git diff --cached --quiet; then
              git commit -m "chore: monthly heartbeat (keep scheduled workflow active)"
              git push
            fi
          fi

      - name: Fetch live conditions
        run: python live_fetch.py

      # history.json is how "days prior" data survives between runs: the runner
      # itself is thrown away after every job, so a commit is the only durable
      # store available to a backend-less static site.
      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record live snapshot"
            git pull --rebase --autostash
            git push
          fi

      - name: Build site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
